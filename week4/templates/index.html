{% extends "base.html" %}

{% block title %} Home Page {% endblock %}

{% block content %}

	<div class="formBlock">
		<h1>歡迎光臨，請輸入信箱密碼</h1>
		<form id="loginForm" method="POST" action="{{ url_for('login') }}">
			<h3 class="loginText">登入系統</h3>
			<div class="labelBlock">
				<label for="email">信箱</label>
    			<input type="text" id="email" name="email" placeholder=" xxx@abc.com" required>
			</div>

			<div class="labelBlock">
				<label for="password">密碼</label>
				<input type="password" id="pwd" name="pwd" placeholder=" xxxxxxxxx" required>
			</div>
				
			<div class="labelBlock">
				<input type="checkbox" id="agree" name="agree">
				<label for="agree">同意條款</label>
			</div>

            <button class="loginBtn" type="submit">登入</button>
		</form>

		<hr>

		<form id="hotelForm" method="GET" action="/">
			<h3 class="loginText">取得旅館資訊</h3>
			<div class="labelBlock">
				<label for="number">編號</label>
    			<input type="number" id="number" name="number" placeholder=" 50">
			</div>
            <button class="hotelBtn" type="submit">取得</button>
		</form>		
	</div>
	
{% endblock %}
